# ──────────────────────────────────────────────────────────────
# nginx.conf — Static catalog server configuration
# ──────────────────────────────────────────────────────────────
# Serves immutable catalog revisions from /catalog/v1/revisions/
# under the /catalog/ URL prefix.  No directory listing, no
# directory traversal, correct MIME types for JSON payloads.
# ──────────────────────────────────────────────────────────────

worker_processes 1;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;

    # Default MIME type for unknown extensions.
    default_type  application/octet-stream;

    # Logging — minimal for a static server.
    access_log    /var/log/nginx/access.log;
    error_log     /var/log/nginx/error.log warn;

    sendfile      on;

    server {
        listen       8080;
        server_name  localhost;

        # ── Root for the catalog tree ──────────────────────
        # Files live under /usr/share/nginx/html/catalog/
        # and are served at the /catalog/ URL prefix.
        root   /usr/share/nginx/html;

        # ── Catalog revisions ──────────────────────────────
        # Serve /catalog/v1/revisions/<revisionId>/...
        location /catalog/ {
            # Disable directory listing (security).
            autoindex off;

            # Prevent directory traversal via encoded dots.
            # nginx does not serve files above the root by
            # default, but this is an explicit safeguard.
            location ~ /\.\. {
                return 403;
            }
        }

        # ── JSON MIME types ────────────────────────────────
        # Ensure .json files are served with the correct
        # content type so clients can parse them directly.
        location ~* \.json$ {
            default_type application/json;
        }

        # ── Default: serve static files ────────────────────
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
