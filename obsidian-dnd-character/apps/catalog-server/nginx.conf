# ──────────────────────────────────────────────────────────────
# nginx.conf — Static catalog server configuration
# ──────────────────────────────────────────────────────────────
# Serves immutable catalog revisions from /catalog/v1/revisions/
# under the /catalog/ URL prefix.  No directory listing, no
# directory traversal, correct MIME types for JSON payloads.
# ──────────────────────────────────────────────────────────────

worker_processes 1;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;

    # Default MIME type for unknown extensions.
    default_type  application/octet-stream;

    # Logging — minimal for a static server.
    access_log    /var/log/nginx/access.log;
    error_log     /var/log/nginx/error.log warn;

    sendfile      on;

    server {
        listen       8080;
        server_name  localhost;

        # ── Root for the catalog tree ──────────────────────
        # Files live under /usr/share/nginx/html/catalog/
        # and are served at the /catalog/ URL prefix.
        root   /usr/share/nginx/html;

        # ── Health check endpoint (P5-T005) ──────────────────
        location = /health {
            default_type application/json;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files /health.json =404;
        }

        # ── Current revision pointer (always fetch fresh) ───
        location = /catalog/v1/current.json {
            default_type application/json;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ── Catalog revisions (immutable, long cache) ───────
        location ^~ /catalog/v1/revisions/ {
            autoindex off;
            default_type application/json;
            add_header Cache-Control "public, max-age=31536000, immutable";

            location ~ /\.\. {
                return 403;
            }
        }

        # ── General catalog (no directory listing) ──────────
        location /catalog/ {
            autoindex off;

            location ~ /\.\. {
                return 403;
            }
        }

        # ── JSON MIME types (short cache for non-revision) ──
        # Ensure .json files are served with the correct
        # content type and a short cache window.
        location ~* \.json$ {
            default_type application/json;
            add_header Cache-Control "public, max-age=60";
        }

        # ── Default: serve static files ────────────────────
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
