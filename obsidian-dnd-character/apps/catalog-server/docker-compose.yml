# ──────────────────────────────────────────────────────────────
# Phase 5 — P5-T002: Docker Compose service definition
# ──────────────────────────────────────────────────────────────
# Serves immutable catalog revisions safely and simply.
#
# Usage:
#   docker compose up -d          # Start the catalog server
#   docker compose down           # Stop and remove the container
#   CATALOG_SERVER_PORT=9090 docker compose up -d  # Override port
# ──────────────────────────────────────────────────────────────

services:
  catalog-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalog-server
    ports:
      - "${CATALOG_SERVER_PORT:-8080}:8080"
    restart: unless-stopped
    # P5-T003: Read-only catalog volume mount
    # Mounts the generated catalog directory as read-only so the
    # container cannot accidentally modify immutable revisions.
    volumes:
      - "${CATALOG_DATA_PATH:-./catalog}:/usr/share/nginx/html/catalog:ro"
    # P5-T005: Docker healthcheck probes the /health endpoint.
    # Uses wget (available in nginx:alpine) instead of curl.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
